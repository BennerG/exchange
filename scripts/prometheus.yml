global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "exchange-producer"
    static_configs:
      - targets: ["host.docker.internal:2112"]

  - job_name: "exchange-matcher"
    static_configs:
      - targets: ["host.docker.internal:2113"]

  - job_name: "exchange-settler"
    static_configs:
      - targets: ["host.docker.internal:2114"]
